<!DOCTYPE html>
<html lang="en" dir="ltr" class="gate-locked">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Secrets — Ahmed & Alaa</title>
  <link rel="icon" href="favicon.svg" />
  <link rel="preconnect" href="https://api.jsonbin.io" />
  <link rel="preconnect" href="https://api.imgbb.com" />
  <link rel="dns-prefetch" href="https://api.jsonbin.io" />
  <link rel="dns-prefetch" href="https://api.imgbb.com" />
  <link rel="dns-prefetch" href="https://i.ibb.co" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&family=Amiri:ital,wght@0,400;1,400&family=Cairo:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:     #B8975A;
      --gold-lt:  #D4B483;
      --gold-pl:  #EEE0C4;
      --gold-dim: rgba(184,151,90,.18);
      --wax:      #C8553D;
      --wax-lt:   #E27358;
      --charcoal: #1C1C1E;
      --dark:     #110D0F;
      --muted:    rgba(255,255,255,.42);
      --white:    #FFFFFF;
      --err:      #E27373;
    }

    html, body {
      min-height: 100vh;
      background:
        radial-gradient(1200px 900px at 50% -10%, rgba(184,151,90,.08), transparent 65%),
        radial-gradient(900px 700px at 50% 110%, rgba(200,85,61,.06), transparent 60%),
        var(--dark);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }
    [lang="ar"] body { font-family: 'Cairo', sans-serif; }

    /* ── GATE ── */
    html.gate-locked { height: 100%; }
    html.gate-locked body { overflow: hidden; min-height: 100vh; }
    html.gate-locked body > *:not(#gate) { visibility: hidden !important; pointer-events: none !important; }
    #gate {
      position: fixed; inset: 0;
      background: var(--dark);
      z-index: 99999;
      display: flex; align-items: center; justify-content: center;
      transition: opacity .8s ease, visibility .8s;
    }
    #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }
    .gate-inner {
      display: flex; flex-direction: column; align-items: center;
      text-align: center; padding: 0 32px;
      animation: gateIn .9s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes gateIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }
    .gate-mono {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 13px; color: var(--gold);
      letter-spacing: .16em; margin-bottom: 24px;
    }
    .gate-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 300; color: var(--white); margin-bottom: 8px;
    }
    [lang="ar"] .gate-title { font-family: 'Amiri', serif; font-weight: 400; }
    .gate-sub {
      font-size: 10px; letter-spacing: .22em; text-transform: uppercase;
      color: rgba(255,255,255,.3); margin-bottom: 36px;
    }
    .gate-seal {
      width: 76px; height: 76px; margin: 0 auto 36px;
      animation: sealFloat 5s ease-in-out infinite;
      filter: drop-shadow(0 0 14px rgba(200,85,61,.45));
    }
    .gate-seal svg { width: 100%; height: 100%; display: block; }
    @keyframes sealFloat {
      0%, 100% { transform: translateY(0) rotate(-3deg); }
      50%      { transform: translateY(-5px) rotate(3deg); }
    }
    .gate-field {
      display: flex; border-bottom: 1px solid rgba(184,151,90,.4);
      width: 100%; max-width: 280px; margin-bottom: 16px;
    }
    .gate-field.shake { animation: shake .4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-8px); } 40% { transform: translateX(8px); }
      60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
    }
    .gate-field input {
      flex: 1; background: none; border: none; outline: none;
      color: var(--white); font-family: 'Jost', sans-serif;
      font-size: 15px; font-weight: 300; padding: 12px 0; letter-spacing: .08em;
    }
    .gate-field input::placeholder { color: rgba(255,255,255,.25); font-style: italic; }
    .gate-field button {
      background: none; border: none; color: var(--gold);
      font-size: 20px; cursor: pointer; padding: 0 4px;
      transition: transform .2s;
    }
    .gate-field button:hover { transform: translateX(4px); }
    .gate-error {
      font-size: 11px; letter-spacing: .1em;
      color: rgba(255,100,100,.7); min-height: 16px;
    }
    .gate-hint {
      font-size: 10px; letter-spacing: .14em;
      color: rgba(255,255,255,.25); margin-top: 12px; font-style: italic;
    }

    /* ── TOP NAV (shared) ── */
    .topnav {
      position: fixed; top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex; align-items: center; justify-content: space-between;
      padding: 18px 28px; gap: 18px;
      background: linear-gradient(to bottom, rgba(17,13,15,.92), rgba(17,13,15,0));
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    }
    .topnav-mono {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 17px; color: var(--gold);
      text-decoration: none; letter-spacing: .04em;
    }
    .topnav-links { display: flex; align-items: flex-end; gap: 28px; }
    .topnav-link {
      font-family: 'Jost', sans-serif;
      font-size: 10px; letter-spacing: .24em; text-transform: uppercase;
      color: var(--muted); text-decoration: none;
      padding: 4px 0 8px; position: relative;
      display: inline-flex; flex-direction: column; align-items: center;
      gap: 5px; white-space: nowrap; transition: color .25s ease;
    }
    .topnav-icon {
      width: 18px; height: 18px;
      display: inline-flex; align-items: center; justify-content: center;
      opacity: .8; transition: opacity .25s ease, transform .25s ease;
    }
    .topnav-icon svg { width: 100%; height: 100%; display: block; }
    .topnav-link:hover { color: var(--gold-lt); }
    .topnav-link:hover .topnav-icon { opacity: 1; transform: translateY(-1px); }
    .topnav-link.active { color: var(--gold-lt); }
    .topnav-link.active .topnav-icon { opacity: 1; }
    .topnav-link.active::after {
      content: ""; position: absolute;
      bottom: 0; left: 50%; transform: translateX(-50%);
      width: 4px; height: 4px;
      background: var(--gold); border-radius: 50%;
    }
    [lang="ar"] .topnav-link { font-family: 'Cairo', sans-serif; letter-spacing: .04em; }
    .topnav-lang {
      font-size: 10px; letter-spacing: .16em; text-transform: uppercase;
      cursor: pointer; background: none;
      border: 1px solid rgba(184,151,90,.3); padding: 6px 14px;
      color: var(--gold-lt); transition: border-color .2s;
    }
    .topnav-lang:hover { border-color: var(--gold); }
    @media (max-width: 760px) {
      .topnav { padding: 12px 16px; gap: 10px; }
      .topnav-links { gap: 16px; }
      .topnav-link { font-size: 9px; letter-spacing: .14em; }
      .topnav-icon { width: 17px; height: 17px; }
      .topnav-mono { font-size: 14px; }
    }
    @media (max-width: 540px) {
      /* phone: hide labels, show icons only — with horizontal-scroll fallback for tiny screens */
      .topnav { padding: 10px 14px; gap: 8px; }
      .topnav-mono { display: none; }
      .topnav-link { padding: 6px 3px; gap: 0; }
      .topnav-link .t { display: none; }
      .topnav-icon { width: 22px; height: 22px; opacity: .85; }
      .topnav-link.active::after { width: 5px; height: 5px; bottom: 1px; }
      .topnav-links {
        flex: 1; min-width: 0;
        gap: 4px; justify-content: flex-end;
        overflow-x: auto; scrollbar-width: none; -webkit-overflow-scrolling: touch;
      }
      .topnav-links::-webkit-scrollbar { display: none; }
      .topnav-lang { padding: 5px 9px; font-size: 9px; letter-spacing: .1em; }
    }

    /* ── IDENTITY PICKER (shown once per device) ── */
    #idpick {
      position: fixed; inset: 0;
      background: rgba(17,13,15,.95);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 9000;
      display: none; align-items: center; justify-content: center;
      padding: 24px;
    }
    #idpick.show { display: flex; animation: fadeIn .5s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .idpick-card {
      max-width: 460px; width: 100%; text-align: center;
      padding: 36px 24px;
      background: linear-gradient(180deg, rgba(28,21,17,.9), rgba(17,13,15,.95));
      border: 1px solid rgba(184,151,90,.25);
      border-radius: 14px;
    }
    .idpick-eyebrow {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      color: var(--gold); font-size: 13px;
      letter-spacing: .18em; margin-bottom: 12px;
    }
    .idpick-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(28px, 6vw, 36px);
      font-weight: 300; margin-bottom: 8px; line-height: 1.1;
    }
    [lang="ar"] .idpick-title { font-family: 'Amiri', serif; }
    .idpick-sub {
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      color: var(--muted); margin-bottom: 28px;
    }
    .idpick-buttons { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
    .idpick-btn {
      flex: 1 1 140px; max-width: 180px;
      padding: 18px 20px;
      background: rgba(184,151,90,.07);
      border: 1px solid rgba(184,151,90,.3);
      color: var(--gold-pl);
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 22px; cursor: pointer;
      border-radius: 10px;
      transition: background .25s, border-color .25s, transform .15s;
    }
    [lang="ar"] .idpick-btn { font-family: 'Amiri', serif; font-style: normal; }
    .idpick-btn:hover {
      background: rgba(184,151,90,.18);
      border-color: var(--gold-lt); transform: translateY(-2px);
    }

    /* ── PAGE ── */
    .page {
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 92px 18px 72px;
    }
    .header-block { text-align: center; max-width: 640px; margin-bottom: 8px; }
    .header-eyebrow {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 13px; color: var(--gold);
      letter-spacing: .18em; margin-bottom: 12px;
    }
    .header-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(48px, 10vw, 92px);
      font-weight: 300; line-height: 1; color: var(--white); margin-bottom: 6px;
    }
    [lang="ar"] .header-title,
    [lang="ar"] .header-eyebrow { font-family: 'Amiri', serif; font-style: normal; }
    .header-me {
      font-family: 'Jost', sans-serif;
      font-size: 10px; letter-spacing: .26em; text-transform: uppercase;
      color: var(--muted); margin-top: 14px;
    }
    .header-me strong { color: var(--gold-lt); font-weight: 400; }
    .header-me a {
      color: var(--gold); text-decoration: none;
      border-bottom: 1px dashed rgba(184,151,90,.4);
      padding-bottom: 1px; margin-left: 8px; cursor: pointer;
    }
    [dir="rtl"] .header-me a { margin-left: 0; margin-right: 8px; }

    /* ── COMPOSE ── */
    .compose {
      width: 100%; max-width: 640px;
      margin: 28px auto 36px;
      background: linear-gradient(180deg, rgba(28,21,17,.85), rgba(17,13,15,.92));
      border: 1px solid rgba(184,151,90,.25);
      border-radius: 12px;
      padding: 16px 16px 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.45), inset 0 1px 0 rgba(212,180,131,.06);
    }
    .compose textarea {
      width: 100%; min-height: 96px; resize: vertical;
      background: transparent; border: none; outline: none;
      color: var(--white);
      font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300;
      line-height: 1.6;
    }
    [lang="ar"] .compose textarea { font-family: 'Cairo', sans-serif; }
    .compose textarea::placeholder { color: rgba(255,255,255,.28); font-style: italic; }
    .compose-divider {
      height: 1px; background: linear-gradient(to right, transparent, rgba(184,151,90,.25), transparent);
      margin: 10px 0 12px;
    }
    .compose-row {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    }
    .compose-tools { display: flex; align-items: center; gap: 6px; flex: 1; flex-wrap: wrap; }
    .icon-btn {
      width: 36px; height: 36px;
      display: inline-flex; align-items: center; justify-content: center;
      background: rgba(184,151,90,.06);
      border: 1px solid rgba(184,151,90,.2);
      border-radius: 8px; color: var(--gold-lt);
      cursor: pointer; transition: background .2s, border-color .2s, color .2s;
    }
    .icon-btn:hover { background: rgba(184,151,90,.16); border-color: var(--gold); color: var(--white); }
    .icon-btn svg { width: 16px; height: 16px; }
    .compose input[type="file"] { display: none; }
    .author-toggle {
      display: inline-flex; padding: 3px;
      background: rgba(184,151,90,.06);
      border: 1px solid rgba(184,151,90,.2);
      border-radius: 8px;
    }
    .author-toggle button {
      background: none; border: none;
      padding: 6px 12px; cursor: pointer;
      color: var(--muted);
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14px; letter-spacing: .04em;
      border-radius: 6px;
      transition: background .2s, color .2s;
    }
    [lang="ar"] .author-toggle button { font-family: 'Amiri', serif; font-style: normal; }
    .author-toggle button.active {
      background: rgba(184,151,90,.18); color: var(--gold-pl);
    }
    .send-btn {
      padding: 9px 18px;
      background: linear-gradient(135deg, var(--gold), var(--gold-lt));
      color: #1a1311; border: none;
      font-family: 'Jost', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      cursor: pointer; border-radius: 8px;
      transition: transform .15s, box-shadow .25s, opacity .25s;
      box-shadow: 0 6px 18px rgba(184,151,90,.25);
    }
    .send-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 10px 26px rgba(184,151,90,.4);
    }
    .send-btn:disabled { opacity: .4; cursor: wait; }
    [lang="ar"] .send-btn { font-family: 'Cairo', sans-serif; letter-spacing: .04em; }
    .compose-photo-preview {
      margin-top: 12px; position: relative;
      border-radius: 8px; overflow: hidden;
      max-height: 220px;
      border: 1px solid rgba(184,151,90,.2);
      display: none;
    }
    .compose-photo-preview.has { display: block; }
    .compose-photo-preview img {
      width: 100%; max-height: 220px; object-fit: cover; display: block;
    }
    .compose-photo-preview .preview-x {
      position: absolute; top: 8px; right: 8px;
      width: 26px; height: 26px;
      background: rgba(17,13,15,.85);
      border: 1px solid rgba(184,151,90,.3);
      color: var(--gold-lt);
      border-radius: 50%; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 14px; line-height: 1;
    }
    .compose-photo-preview .preview-x:hover { color: var(--err); border-color: var(--err); }

    .compose-status {
      font-family: 'Jost', sans-serif; font-size: 11px;
      color: var(--muted); margin-top: 10px;
      letter-spacing: .12em; text-transform: uppercase;
      min-height: 14px;
    }
    .compose-status.err { color: var(--err); }
    .compose-status.ok  { color: var(--gold-lt); }
    [lang="ar"] .compose-status { font-family: 'Cairo', sans-serif; letter-spacing: .04em; text-transform: none; }

    /* ── FEED ── */
    .feed {
      width: 100%; max-width: 640px;
      display: flex; flex-direction: column; gap: 18px;
    }
    .feed-empty {
      text-align: center; padding: 40px 20px;
      color: var(--muted); font-style: italic;
      font-family: 'Cormorant Garamond', serif;
      font-size: 16px;
    }
    [lang="ar"] .feed-empty { font-family: 'Amiri', serif; font-style: normal; }
    .feed-loading {
      text-align: center; padding: 28px 20px; color: var(--muted);
      font-size: 11px; letter-spacing: .2em; text-transform: uppercase;
    }

    .secret {
      position: relative;
      background: linear-gradient(180deg, rgba(28,21,17,.85), rgba(17,13,15,.92));
      border: 1px solid rgba(184,151,90,.18);
      border-radius: 10px;
      padding: 16px 16px 14px;
      box-shadow: 0 18px 40px rgba(0,0,0,.5), inset 0 1px 0 rgba(212,180,131,.06);
      transition: border-color .35s, box-shadow .35s;
      animation: secretIn .55s cubic-bezier(.22,1,.36,1);
    }
    @keyframes secretIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    .secret:hover { border-color: rgba(212,180,131,.4); }
    .secret-meta {
      display: flex; justify-content: space-between; align-items: center;
      gap: 12px; margin-bottom: 10px;
      padding-right: 40px;            /* leave room for the absolute .secret-x */
    }
    [dir="rtl"] .secret-meta { padding-right: 0; padding-left: 40px; }
    .secret-author {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 14px; color: var(--gold-lt);
    }
    [lang="ar"] .secret-author { font-family: 'Amiri', serif; font-style: normal; }
    .secret-author::before {
      content: ""; display: inline-block;
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 10px rgba(184,151,90,.5);
    }
    .secret-time {
      font-family: 'Jost', sans-serif;
      font-size: 9.5px; letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted);
    }
    [lang="ar"] .secret-time { font-family: 'Cairo', sans-serif; letter-spacing: .04em; text-transform: none; }
    .secret-x {
      position: absolute; top: 10px; right: 10px;
      z-index: 3;                     /* sit above .secret-meta so clicks land here */
      width: 26px; height: 26px;
      background: rgba(17,13,15,.85);
      border: 1px solid rgba(184,151,90,.28);
      color: rgba(238,224,196,.65);
      border-radius: 50%; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 13px; line-height: 1;
      transition: color .2s, border-color .2s, background .2s, transform .15s;
    }
    [dir="rtl"] .secret-x { right: auto; left: 10px; }
    .secret-x:hover {
      color: var(--err); border-color: var(--err);
      background: rgba(226,115,115,.12);
      transform: scale(1.08);
    }

    .secret-text {
      font-family: 'Jost', sans-serif; font-size: 15px; font-weight: 300;
      line-height: 1.65; color: rgba(238,224,196,.92);
      white-space: pre-wrap; word-wrap: break-word;
    }
    [lang="ar"] .secret-text { font-family: 'Cairo', sans-serif; }
    .secret-photo {
      margin-top: 12px; border-radius: 8px; overflow: hidden;
      border: 1px solid rgba(184,151,90,.18);
      display: block; cursor: pointer;
    }
    .secret-photo img {
      width: 100%; height: auto; display: block;
      transition: transform .5s cubic-bezier(.22,1,.36,1);
    }
    .secret-photo:hover img { transform: scale(1.02); }

    /* sealed states */
    .secret.sealed .secret-text,
    .secret.sealed .secret-photo {
      filter: blur(14px);
      pointer-events: none;
      user-select: none;
    }
    .secret-seal {
      display: none;
      margin-top: 14px; text-align: center;
    }
    .secret.sealed .secret-seal { display: block; }
    .seal-line {
      font-family: 'Cormorant Garamond', serif; font-style: italic;
      font-size: 13px; color: var(--gold); letter-spacing: .14em;
      margin-bottom: 12px;
    }
    [lang="ar"] .seal-line { font-family: 'Amiri', serif; font-style: normal; }
    .seal-open {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 9px 18px;
      background: linear-gradient(135deg, var(--wax), var(--wax-lt));
      color: var(--white); border: none;
      font-family: 'Jost', sans-serif;
      font-size: 11px; font-weight: 500;
      letter-spacing: .2em; text-transform: uppercase;
      cursor: pointer; border-radius: 8px;
      box-shadow: 0 6px 18px rgba(200,85,61,.35);
      transition: transform .15s, box-shadow .25s;
    }
    .seal-open:hover { transform: translateY(-1px); box-shadow: 0 10px 26px rgba(200,85,61,.5); }
    [lang="ar"] .seal-open { font-family: 'Cairo', sans-serif; letter-spacing: .04em; text-transform: none; }
    .seal-pending {
      display: inline-block;
      padding: 6px 14px;
      background: rgba(184,151,90,.06);
      border: 1px dashed rgba(184,151,90,.3);
      color: var(--muted);
      font-family: 'Jost', sans-serif;
      font-size: 10px; letter-spacing: .2em; text-transform: uppercase;
      border-radius: 999px;
    }
    [lang="ar"] .seal-pending { font-family: 'Cairo', sans-serif; letter-spacing: .04em; text-transform: none; }

    /* opening flash */
    .secret.opening .secret-text,
    .secret.opening .secret-photo {
      animation: unsealReveal .8s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes unsealReveal {
      0%   { filter: blur(14px); opacity: .4; }
      60%  { filter: blur(0);     opacity: 1; }
      100% { filter: blur(0);     opacity: 1; }
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.9); z-index: 9500;
      display: none; align-items: center; justify-content: center;
      padding: 32px; cursor: zoom-out;
    }
    #lightbox.show { display: flex; }
    #lightbox img {
      max-width: 100%; max-height: 100%;
      border-radius: 6px;
      box-shadow: 0 30px 80px rgba(0,0,0,.7);
    }

    /* ── TOAST ── */
    .toast {
      position: fixed; bottom: 28px; left: 50%;
      transform: translateX(-50%) translateY(20px);
      padding: 11px 22px;
      background: rgba(28,21,17,.95);
      border: 1px solid rgba(184,151,90,.4);
      color: var(--gold-pl);
      font-family: 'Jost', sans-serif;
      font-size: 11px; letter-spacing: .18em; text-transform: uppercase;
      border-radius: 999px;
      opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s;
      z-index: 9800;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { color: var(--err); border-color: var(--err); }
    [lang="ar"] .toast { font-family: 'Cairo', sans-serif; letter-spacing: .04em; text-transform: none; }

    /* ── DEDICATION & FOOT ── */
    .ornament {
      display: flex; align-items: center; justify-content: center;
      gap: 14px; margin: 36px auto 8px;
      width: 100%; max-width: 360px;
    }
    .ornament-line {
      flex: 1; height: 1px;
      background: linear-gradient(to right, transparent, rgba(184,151,90,.4), transparent);
    }
    .ornament-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); }
    .page-foot {
      margin-top: 16px; font-size: 10px;
      letter-spacing: .2em; text-transform: uppercase;
      color: var(--muted); text-align: center;
    }
    .page-foot strong { color: var(--gold-lt); font-weight: 400; }

    @media (max-width: 480px) {
      .compose { padding: 14px; }
      .compose textarea { font-size: 14px; }
      .secret-text { font-size: 14px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .gate-seal, .secret { animation: none; transition: none; }
      .secret.opening .secret-text, .secret.opening .secret-photo { animation: none; }
    }
  </style>

<script>
  // ═══════════════════════════════════════════════════════════════
  //  CONFIG
  // ═══════════════════════════════════════════════════════════════
  const PASS         = 'between-us';
  const AUTH_KEY     = 'secrets_auth_v1';
  const WHO_KEY      = 'secrets_who';            // 'ahmed' | 'alaa'
  const LOCAL_CACHE  = 'secrets_cache_v1';

  const JB = {
    key:   '$2a$10$KbNF/mCJtyHlUvHzwELTKOdQ0Sybn.GKVOW/1S8XJqeZQrYSwULwq',
    binId: '69efe637aaba88219745476c'
  };
  const IMGBB_KEY = '9e3fc8346ca90d74bfacbd8c70e4d974';

  // ═══════════════════════════════════════════════════════════════
  //  TINY UTILS
  // ═══════════════════════════════════════════════════════════════
  const $  = (s) => document.querySelector(s);
  const $$ = (s) => Array.from(document.querySelectorAll(s));
  const isAR = () => document.documentElement.lang === 'ar';

  function escapeHTML(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }
  function newId() { return 'sec_' + Math.random().toString(36).slice(2, 11) + Date.now().toString(36); }

  let toastTimer = null;
  function toast(msg, kind = '') {
    const t = $('#toast');
    t.textContent = msg;
    t.className = 'toast show' + (kind ? ' ' + kind : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 2800);
  }

  function relTime(ts) {
    const diff = Date.now() - ts;
    const min = Math.round(diff / 60000);
    const ar = isAR();
    if (min < 1)   return ar ? 'الآن'              : 'just now';
    if (min < 60)  return ar ? `منذ ${min} د`      : `${min}m ago`;
    const h = Math.round(min / 60);
    if (h < 24)    return ar ? `منذ ${h} س`        : `${h}h ago`;
    const d = Math.round(h / 24);
    if (d < 7)     return ar ? `منذ ${d} يوم`      : `${d}d ago`;
    const date = new Date(ts);
    const opts = { day: 'numeric', month: 'short', year: 'numeric' };
    return date.toLocaleDateString(ar ? 'ar-EG' : 'en-GB', opts);
  }

  // ═══════════════════════════════════════════════════════════════
  //  IDENTITY (per device)
  // ═══════════════════════════════════════════════════════════════
  function getMe()        { return localStorage.getItem(WHO_KEY) || ''; }
  function setMe(who)     { localStorage.setItem(WHO_KEY, who); }
  function otherOf(who)   { return who === 'ahmed' ? 'alaa' : 'ahmed'; }
  function nameOf(who)    {
    if (isAR()) return who === 'ahmed' ? 'أحمد' : 'آلاء';
    return who === 'ahmed' ? 'Ahmed' : 'Alaa';
  }
  function refreshMeUI() {
    const me = getMe();
    $('#me-name').textContent = me ? nameOf(me) : '—';
    // tint compose author toggle to default to me
    setComposeAuthor(me || 'ahmed');
  }
  function showIdPick() {
    $('#idpick').classList.add('show');
    $('#idpick').setAttribute('aria-hidden', 'false');
  }
  function hideIdPick() {
    $('#idpick').classList.remove('show');
    $('#idpick').setAttribute('aria-hidden', 'true');
  }
  function switchIdentity() {
    showIdPick();
  }
  $$('.idpick-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      setMe(btn.dataset.who);
      hideIdPick();
      refreshMeUI();
      render();
    });
  });

  // ═══════════════════════════════════════════════════════════════
  //  COMPOSE — author toggle, photo picker, resize, post
  // ═══════════════════════════════════════════════════════════════
  let _selectedAuthor = 'ahmed';
  let _pendingPhotoB64 = null;     // base64 (no prefix), ready for ImgBB
  let _sending = false;

  function setComposeAuthor(who) {
    _selectedAuthor = who;
    $$('.author-toggle button').forEach(b => {
      b.classList.toggle('active', b.dataset.who === who);
    });
  }
  $$('.author-toggle button').forEach(b => {
    b.addEventListener('click', () => setComposeAuthor(b.dataset.who));
  });

  $('#photo-input').addEventListener('change', async (e) => {
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      composeStatus(isAR() ? 'هذا ليس صورة' : 'That is not an image', 'err');
      return;
    }
    try {
      composeStatus(isAR() ? 'جاري ضغط الصورة…' : 'Compressing photo…');
      const { dataUrl } = await resizeImage(file, 1600, 0.85);
      _pendingPhotoB64 = dataUrl.split(',')[1];          // strip "data:image/jpeg;base64,"
      $('#photo-preview-img').src = dataUrl;
      $('#photo-preview').classList.add('has');
      composeStatus('');
    } catch (err) {
      console.error(err);
      composeStatus(isAR() ? 'تعذّر معالجة الصورة' : 'Could not process the photo', 'err');
    }
  });

  function clearPhoto() {
    _pendingPhotoB64 = null;
    $('#photo-preview').classList.remove('has');
    $('#photo-preview-img').src = '';
  }

  function resizeImage(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let { width: w, height: h } = img;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else        { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.imageSmoothingQuality = 'high';
          ctx.drawImage(img, 0, 0, w, h);
          resolve({ dataUrl: canvas.toDataURL('image/jpeg', quality), w, h });
        };
        img.onerror = reject;
        img.src = e.target.result;
      };
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }

  function composeStatus(msg, kind = '') {
    const el = $('#compose-status');
    el.textContent = msg || '';
    el.className = 'compose-status' + (kind ? ' ' + kind : '');
  }

  async function uploadToImgBB(base64) {
    const fd = new FormData();
    fd.append('image', base64);
    const r = await fetch(`https://api.imgbb.com/1/upload?key=${IMGBB_KEY}`, {
      method: 'POST', body: fd
    });
    if (!r.ok) throw new Error('imgbb http ' + r.status);
    const j = await r.json();
    if (!j || !j.success || !j.data || !j.data.url) throw new Error('imgbb bad response');
    return j.data.url;
  }

  async function postSecret() {
    if (_sending) return;
    const text = $('#compose-text').value.trim();
    if (!text && !_pendingPhotoB64) {
      composeStatus(isAR() ? 'اكتب شيئاً أو أرفق صورة' : 'Write something or attach a photo', 'err');
      return;
    }
    _sending = true;
    $('#send-btn').disabled = true;

    let photoUrl = null;
    try {
      if (_pendingPhotoB64) {
        composeStatus(isAR() ? 'جاري رفع الصورة…' : 'Uploading photo…');
        photoUrl = await uploadToImgBB(_pendingPhotoB64);
      }
      composeStatus(isAR() ? 'جاري الختم…' : 'Sealing…');
      const secret = {
        id: newId(),
        author: _selectedAuthor,
        ts: Date.now(),
        text, photoUrl,
        openedBy: []
      };
      await appendSecret(secret);

      // reset compose
      $('#compose-text').value = '';
      clearPhoto();
      composeStatus(isAR() ? 'تم الختم ♡' : 'Sealed ♡', 'ok');
      setTimeout(() => composeStatus(''), 1800);
      render();
    } catch (err) {
      console.error(err);
      composeStatus(isAR() ? 'فشل الإرسال — حاول مرة أخرى' : 'Failed to send — try again', 'err');
    } finally {
      _sending = false;
      $('#send-btn').disabled = false;
    }
  }

  // ═══════════════════════════════════════════════════════════════
  //  STORAGE — JSONBin (shared bin, namespaced under `secrets`)
  // ═══════════════════════════════════════════════════════════════
  function readCache() {
    try {
      const raw = localStorage.getItem(LOCAL_CACHE);
      if (!raw) return [];
      const arr = JSON.parse(raw);
      return Array.isArray(arr) ? arr : [];
    } catch { return []; }
  }
  function writeCache(arr) {
    try { localStorage.setItem(LOCAL_CACHE, JSON.stringify(arr)); } catch {}
  }

  async function jbLoadAll() {
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${JB.binId}/latest`, {
        headers: { 'X-Access-Key': JB.key }
      });
      if (!r.ok) return null;
      const j = await r.json();
      return (j && j.record) ? j.record : null;
    } catch { return null; }
  }
  async function jbSaveAll(data) {
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${JB.binId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Access-Key': JB.key },
        body: JSON.stringify(data)
      });
      return true;
    } catch { return false; }
  }
  function ensureSecretsArr(record) {
    if (!record || typeof record !== 'object') record = {};
    if (!Array.isArray(record.secrets)) record.secrets = [];
    return record;
  }

  /** Load secrets array (newest first), with cache fallback. */
  async function loadSecrets() {
    const remote = await jbLoadAll();
    if (remote === null) return readCache();
    const rec = ensureSecretsArr(remote);
    const sorted = [...rec.secrets].sort((a, b) => b.ts - a.ts);
    writeCache(sorted);
    return sorted;
  }

  /** Read-merge-write helper. Mutator gets and returns the secrets array. */
  async function mutateSecrets(mutator) {
    const remote = await jbLoadAll();
    const rec    = ensureSecretsArr(remote);
    rec.secrets  = mutator([...rec.secrets]);
    const ok = await jbSaveAll(rec);
    const sorted = [...rec.secrets].sort((a, b) => b.ts - a.ts);
    writeCache(sorted);
    if (!ok) toast(isAR() ? 'تعذّر المزامنة — حُفظ محلياً' : 'Sync failed — saved locally', 'err');
    return sorted;
  }

  async function appendSecret(secret) {
    return mutateSecrets((arr) => { arr.push(secret); return arr; });
  }
  async function deleteSecret(id) {
    return mutateSecrets((arr) => arr.filter(s => s.id !== id));
  }
  async function markOpened(id, who) {
    return mutateSecrets((arr) => arr.map(s => {
      if (s.id !== id) return s;
      const set = new Set(Array.isArray(s.openedBy) ? s.openedBy : []);
      set.add(who);
      return { ...s, openedBy: [...set] };
    }));
  }

  // ═══════════════════════════════════════════════════════════════
  //  RENDER
  // ═══════════════════════════════════════════════════════════════
  function isSealedFor(secret, me) {
    if (!me) return true;
    if (secret.author === me) return false;                 // you wrote it
    return !((secret.openedBy || []).includes(me));         // sealed if you haven't opened
  }

  function renderSecret(s) {
    const me     = getMe();
    const sealed = isSealedFor(s, me);
    const mine   = me && (s.author === me);
    const ar     = isAR();
    const safeText = escapeHTML(s.text || '');
    const photo = s.photoUrl
      ? `<a class="secret-photo" onclick="openLightbox('${escapeHTML(s.photoUrl)}')">
           <img src="${escapeHTML(s.photoUrl)}" alt="" loading="lazy" decoding="async" />
         </a>` : '';

    const sealBlock = (() => {
      if (!sealed) return '';
      if (mine) {
        return `<div class="seal-pending">${ar ? 'مختوم — بانتظار ' + nameOf(otherOf(s.author)) : 'Sealed — waiting for ' + nameOf(otherOf(s.author))}</div>`;
      }
      return `
        <div class="seal-line">${ar ? 'مظروفٌ مختوم — افتحه برفق' : 'A sealed envelope — open it gently'}</div>
        <button class="seal-open" onclick="openSeal('${s.id}')">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="margin-right:6px"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          ${ar ? 'افتح' : 'Open envelope'}
        </button>`;
    })();

    return `
      <article class="secret ${sealed ? 'sealed' : ''}" data-id="${escapeHTML(s.id)}">
        <button class="secret-x" onclick="onDelete('${s.id}')" aria-label="Delete">✕</button>
        <div class="secret-meta">
          <span class="secret-author">— ${escapeHTML(nameOf(s.author))}</span>
          <span class="secret-time">${escapeHTML(relTime(s.ts))}</span>
        </div>
        <div class="secret-text">${safeText.replace(/\n/g, '<br>')}</div>
        ${photo}
        <div class="secret-seal">${sealBlock}</div>
      </article>`;
  }

  let _data = [];
  function paint() {
    const feed = $('#feed');
    if (!_data.length) {
      feed.innerHTML = `<div class="feed-empty">${isAR()
        ? 'لا أسرار بعد. اكتب أوّل واحد بالأعلى.'
        : 'No secrets yet. Write the first one above.'}</div>`;
      return;
    }
    feed.innerHTML = _data.map(renderSecret).join('');
  }
  async function render() {
    paint();                              // paint cache instantly
    _data = await loadSecrets();          // refresh from cloud
    paint();
  }

  // ── seal opening ──
  async function openSeal(id) {
    const me = getMe();
    if (!me) { showIdPick(); return; }
    const s = _data.find(x => x.id === id);
    if (!s) return;
    // visually open immediately
    const el = document.querySelector(`.secret[data-id="${id}"]`);
    if (el) {
      el.classList.remove('sealed');
      el.classList.add('opening');
      // refresh inner sealBlock so the "Open" button disappears
      const sealEl = el.querySelector('.secret-seal');
      if (sealEl) sealEl.innerHTML = '';
      setTimeout(() => el.classList.remove('opening'), 800);
    }
    // persist
    _data = await markOpened(id, me);
  }

  // ── delete ──
  async function onDelete(id) {
    const ok = window.confirm(isAR()
      ? 'حذف هذا السرّ نهائياً؟'
      : 'Delete this secret forever?');
    if (!ok) return;
    _data = await deleteSecret(id);
    paint();
    toast(isAR() ? 'تم الحذف' : 'Deleted');
  }

  // ── lightbox ──
  function openLightbox(url) {
    if (!url) return;
    $('#lightbox-img').src = url;
    $('#lightbox').classList.add('show');
    $('#lightbox').setAttribute('aria-hidden', 'false');
  }
  function closeLightbox() {
    $('#lightbox').classList.remove('show');
    $('#lightbox').setAttribute('aria-hidden', 'true');
    $('#lightbox-img').src = '';
  }
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeLightbox(); });

  // ═══════════════════════════════════════════════════════════════
  //  GATE
  // ═══════════════════════════════════════════════════════════════
  function checkPass() {
    const input = $('#gate-input');
    const field = $('#gate-field');
    const err   = $('#gate-error');
    if (input.value.trim().toLowerCase() === PASS) {
      sessionStorage.setItem(AUTH_KEY, 'yes');
      document.documentElement.classList.remove('gate-locked');
      $('#gate').classList.add('hide');
      onUnlocked();
    } else {
      input.value = '';
      err.textContent = isAR() ? 'هذه ليست الكلمة السحرية ♡' : 'That\'s not the secret ♡';
      field.classList.remove('shake'); void field.offsetWidth; field.classList.add('shake');
      setTimeout(() => { err.textContent = ''; }, 2400);
    }
  }
  $('#gate-input').addEventListener('keydown', e => { if (e.key === 'Enter') checkPass(); });
  if (sessionStorage.getItem(AUTH_KEY) === 'yes') {
    document.documentElement.classList.remove('gate-locked');
    $('#gate').classList.add('hide');
    onUnlocked();
  }

  function onUnlocked() {
    if (!getMe()) showIdPick();
    refreshMeUI();
    render();
  }

  // ═══════════════════════════════════════════════════════════════
  //  LANG TOGGLE
  // ═══════════════════════════════════════════════════════════════
  let lang = 'en';
  function toggleLang() {
    lang = lang === 'en' ? 'ar' : 'en';
    const html = document.documentElement;
    html.lang = lang;
    html.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    $('.topnav-lang').textContent = lang === 'ar' ? 'English' : 'عربي';
    $$('.t[data-en]').forEach(el => {
      // some elements use data-en / data-ar as inner text
      if (el.tagName === 'BUTTON' && el.dataset.who) {
        el.textContent = (lang === 'ar') ? el.dataset.ar : el.dataset.en;
      } else if (el.dataset.enText) {
        el.textContent = (lang === 'ar') ? el.dataset.arText : el.dataset.enText;
      } else {
        el.innerHTML = el.dataset[lang];
      }
    });
    // textarea placeholder
    const ta = $('#compose-text');
    if (ta) ta.placeholder = lang === 'ar'
      ? ta.dataset.placeholderAr
      : ta.dataset.placeholderEn;
    // update "switch" link text and "you are" label
    refreshMeUI();
    paint();   // re-render times in correct locale
  }
</script>
</body>
</html>
