<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="referrer" content="no-referrer" />
  <title>Our Daily Flame — Ahmed & Alaa</title>
  <link rel="preconnect" href="https://api.jsonbin.io" />
  <link rel="dns-prefetch" href="https://api.jsonbin.io" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Jost:wght@200;300;400;500&family=Amiri:ital,wght@0,400;1,400&family=Cairo:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --gold:     #B8975A;
      --gold-lt:  #D4B483;
      --gold-dim: rgba(184,151,90,.18);
      --charcoal: #1C1C1E;
      --dark:     #111110;
      --muted:    rgba(255,255,255,.4);
      --white:    #FFFFFF;
    }

    /* ── GATE ── */
    #gate {
      position: fixed;
      inset: 0;
      background: var(--dark);
      z-index: 99999;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity .8s ease, visibility .8s;
    }
    #gate.hide { opacity: 0; visibility: hidden; pointer-events: none; }

    .gate-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      text-align: center;
      padding: 0 32px;
      animation: gateIn .9s cubic-bezier(.22,1,.36,1) forwards;
    }
    @keyframes gateIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    .gate-mono {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 13px;
      color: var(--gold);
      letter-spacing: .16em;
      margin-bottom: 24px;
    }
    .gate-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(32px, 8vw, 52px);
      font-weight: 300;
      color: var(--white);
      margin-bottom: 8px;
    }
    .gate-sub {
      font-size: 10px;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: rgba(255,255,255,.3);
      margin-bottom: 40px;
    }

    /* mini flame */
    .gate-flame {
      position: relative;
      width: 50px;
      height: 72px;
      margin: 0 auto 40px;
    }
    .gf {
      position: absolute;
      bottom: 0; left: 50%;
      border-radius: 50% 50% 30% 30% / 60% 60% 40% 40%;
      transform-origin: bottom center;
    }
    .gf1 {
      width: 36px; height: 62px;
      background: radial-gradient(ellipse 80% 100% at 50% 100%, rgba(184,151,90,.9) 0%, rgba(100,65,10,.4) 60%, transparent 100%);
      filter: blur(3px);
      animation: fabSway 2.2s ease-in-out infinite alternate;
    }
    .gf2 {
      width: 22px; height: 44px;
      background: radial-gradient(ellipse 70% 100% at 50% 100%, rgba(220,190,110,1) 0%, rgba(184,151,90,.7) 55%, transparent 100%);
      animation: fabSway 1.6s ease-in-out infinite alternate-reverse;
    }
    .gf3 {
      width: 10px; height: 22px;
      background: radial-gradient(ellipse at 50% 100%, rgba(255,255,220,1) 0%, rgba(220,190,100,.8) 60%, transparent 100%);
      animation: fabSway 1.1s ease-in-out infinite alternate;
    }
    @keyframes fabSway {
      0%   { transform: translateX(-50%) rotate(-5deg); }
      100% { transform: translateX(-50%) rotate(5deg) scaleX(.85); }
    }

    .gate-field {
      display: flex;
      border-bottom: 1px solid rgba(184,151,90,.4);
      width: 100%;
      max-width: 280px;
      margin-bottom: 16px;
    }
    .gate-field.shake { animation: shake .4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-8px); }
      40%      { transform: translateX(8px); }
      60%      { transform: translateX(-6px); }
      80%      { transform: translateX(6px); }
    }

    .gate-field input {
      flex: 1;
      background: none;
      border: none;
      outline: none;
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-size: 15px;
      font-weight: 300;
      padding: 12px 0;
      letter-spacing: .08em;
    }
    .gate-field input::placeholder { color: rgba(255,255,255,.25); font-style: italic; }
    .gate-field button {
      background: none;
      border: none;
      color: var(--gold);
      font-size: 20px;
      cursor: pointer;
      padding: 0 4px;
      transition: transform .2s;
    }
    .gate-field button:hover { transform: translateX(4px); }

    .gate-error {
      font-size: 11px;
      letter-spacing: .1em;
      color: rgba(255,100,100,.7);
      min-height: 16px;
    }

    html, body {
      min-height: 100vh;
      background: var(--dark);
      color: var(--white);
      font-family: 'Jost', sans-serif;
      font-weight: 300;
      overflow-x: hidden;
    }

    /* ── TOP NAV (shared) ── */
    .topnav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 28px;
      gap: 18px;
      background: linear-gradient(to bottom, rgba(17,17,16,.92), rgba(17,17,16,0));
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
    }
    .topnav-mono {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 17px;
      color: var(--gold);
      text-decoration: none;
      letter-spacing: .04em;
    }
    .topnav-links { display: flex; align-items: flex-end; gap: 28px; }
    .topnav-link {
      font-family: 'Jost', sans-serif;
      font-size: 10px;
      letter-spacing: .24em;
      text-transform: uppercase;
      color: var(--muted);
      text-decoration: none;
      padding: 4px 0 8px;
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
      transition: color .25s ease;
    }
    .topnav-icon {
      width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      opacity: .8;
      transition: opacity .25s ease, transform .25s ease;
    }
    .topnav-icon svg { width: 100%; height: 100%; display: block; }
    .topnav-link:hover { color: var(--gold-lt); }
    .topnav-link:hover .topnav-icon { opacity: 1; transform: translateY(-1px); }
    .topnav-link.active { color: var(--gold-lt); }
    .topnav-link.active .topnav-icon { opacity: 1; }
    .topnav-link.active::after {
      content: "";
      position: absolute;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 4px; height: 4px;
      background: var(--gold);
      border-radius: 50%;
    }
    [lang="ar"] .topnav-link { font-family: 'Cairo', sans-serif; letter-spacing: .04em; }
    .topnav-lang {
      font-size: 10px;
      letter-spacing: .16em;
      text-transform: uppercase;
      cursor: pointer;
      background: none;
      border: 1px solid rgba(184,151,90,.3);
      padding: 6px 14px;
      color: var(--gold-lt);
      transition: border-color .2s;
    }
    .topnav-lang:hover { border-color: var(--gold); }
    @media (max-width: 760px) {
      .topnav { padding: 12px 16px; gap: 10px; }
      .topnav-links { gap: 18px; }
      .topnav-link { font-size: 9px; letter-spacing: .14em; }
      .topnav-icon { width: 17px; height: 17px; }
      .topnav-mono { font-size: 14px; }
    }
    @media (max-width: 480px) {
      .topnav-mono { display: none; }
      .topnav-links { gap: 14px; }
      .topnav-link { font-size: 8.5px; letter-spacing: .08em; gap: 3px; padding-bottom: 6px; }
      .topnav-icon { width: 16px; height: 16px; }
      .topnav-lang { padding: 5px 10px; font-size: 9px; }
    }

    /* ── MAIN ── */
    .page {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 100px 24px 60px;
      gap: 0;
    }

    /* ── STREAK HEADER ── */
    .streak-header { text-align: center; margin-bottom: 48px; }
    .streak-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(72px, 18vw, 120px);
      font-weight: 300;
      line-height: 1;
      color: var(--white);
      transition: all .6s cubic-bezier(.22,1,.36,1);
    }
    .streak-num.pop { animation: numPop .5s cubic-bezier(.22,1,.36,1); }
    @keyframes numPop {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.15); color: var(--gold-lt); }
      100% { transform: scale(1); }
    }
    .streak-label {
      font-size: 9px;
      letter-spacing: .28em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
    }
    .streak-best {
      font-size: 11px;
      letter-spacing: .14em;
      color: var(--gold);
      margin-top: 10px;
    }

    /* ── FLAME ── */
    .flame-wrap {
      position: relative;
      width: 140px;
      height: 220px;
      margin: 0 auto 52px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .flame-glow {
      position: absolute;
      bottom: -20px;
      left: 50%;
      transform: translateX(-50%);
      width: 120px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(ellipse, rgba(184,151,90,.5) 0%, transparent 70%);
      filter: blur(12px);
      transition: opacity .8s ease, transform .8s ease;
    }

    .flame-svg {
      position: absolute;
      bottom: 14px;
      left: 50%;
      width: 100px;
      height: 180px;
      transform: translateX(-50%) scale(1);
      transform-origin: 50% 100%;
      transition: transform .9s cubic-bezier(.22,1,.36,1),
                  opacity .9s ease,
                  filter .9s ease;
      overflow: visible;
      will-change: transform, filter;
    }
    .flame-svg .flame-core {
      transform-origin: 50% 88%;
      animation: flameCorePulse 1.9s ease-in-out infinite;
    }
    @keyframes flameCorePulse {
      0%, 100% { transform: scaleY(1);    opacity: .9; }
      50%      { transform: scaleY(1.12); opacity: 1;  }
    }
    @keyframes flameLive {
      0%, 100% { transform: translateX(-50%) scale(1, 1); }
      25%      { transform: translateX(-50%) scale(1.03, .97); }
      50%      { transform: translateX(-50%) scale(.97, 1.04); }
      75%      { transform: translateX(-50%) scale(1.02, .99); }
    }

    .wick {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 4px;
      height: 16px;
      background: linear-gradient(to top, #3a2800, #6b4a00);
      border-radius: 2px;
    }

    /* Flame states */
    .flame-wrap.dim .flame-svg {
      transform: translateX(-50%) scale(.38);
      opacity: .55;
      filter: drop-shadow(0 0 6px rgba(184,151,90,.3));
    }
    .flame-wrap.dim .flame-glow {
      opacity: .2;
      transform: translateX(-50%) scale(.5);
    }

    .flame-wrap.half .flame-svg {
      transform: translateX(-50%) scale(.72);
      opacity: .92;
      filter: drop-shadow(0 0 14px rgba(212,180,131,.55));
    }
    .flame-wrap.half .flame-glow { opacity: .55; }

    .flame-wrap.full .flame-svg {
      opacity: 1;
      filter: drop-shadow(0 0 26px rgba(238,224,196,.85));
      animation: flameLive 2.8s ease-in-out infinite;
    }
    .flame-wrap.full .flame-glow {
      opacity: 1;
      width: 180px; height: 120px;
      background: radial-gradient(ellipse, rgba(212,180,131,.7) 0%, rgba(184,151,90,.3) 50%, transparent 70%);
    }

    @media (prefers-reduced-motion: reduce) {
      .flame-svg, .flame-svg .flame-core, .flame-glow { animation: none; }
    }

    /* ── STATUS ROW ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 24px;
      margin-bottom: 40px;
      flex-wrap: wrap;
      justify-content: center;
    }
    .status-divider {
      width: 1px;
      height: 40px;
      background: rgba(184,151,90,.2);
    }

    /* ── HEART BUTTONS ── */
    .heart-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      background: none;
      border: 1px solid rgba(184,151,90,.25);
      padding: 24px 36px;
      cursor: pointer;
      transition: border-color .3s, background .3s, transform .15s;
      min-width: 150px;
      position: relative;
      overflow: hidden;
    }
    .heart-btn:hover { border-color: var(--gold); }
    .heart-btn:active { transform: scale(.96); }

    .heart-btn.tapped {
      border-color: var(--gold);
      background: rgba(184,151,90,.08);
    }

    .heart-icon {
      font-size: 40px;
      line-height: 1;
      transition: transform .4s cubic-bezier(.22,1,.36,1), color .3s;
      color: rgba(255,255,255,.3);
    }
    .heart-btn.tapped .heart-icon { color: var(--gold); transform: scale(1.15); }

    .heart-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 22px;
      font-weight: 300;
      color: var(--white);
      letter-spacing: .04em;
    }
    .heart-status-text {
      font-size: 9px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      transition: color .3s;
    }
    .heart-btn.tapped .heart-status-text { color: var(--gold); }

    /* Ripple */
    .ripple {
      position: absolute;
      border-radius: 50%;
      background: rgba(184,151,90,.3);
      transform: scale(0);
      animation: rippleOut .6s ease-out forwards;
      pointer-events: none;
    }
    @keyframes rippleOut {
      to { transform: scale(4); opacity: 0; }
    }

    /* ── MESSAGE ── */
    .flame-message {
      font-family: 'Cormorant Garamond', serif;
      font-style: italic;
      font-size: 18px;
      color: var(--muted);
      text-align: center;
      margin-bottom: 48px;
      min-height: 28px;
      transition: color .5s;
    }
    .flame-message.lit { color: var(--gold-lt); }

    /* ── HISTORY DOTS ── */
    .history-wrap {
      width: 100%;
      max-width: 480px;
      margin-bottom: 36px;
    }
    .history-label {
      font-size: 9px;
      letter-spacing: .2em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      text-align: center;
    }
    .history-dots {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 6px;
    }
    .h-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      transition: transform .2s;
    }
    .h-dot:hover { transform: scale(1.4); }
    .h-dot.complete { background: var(--gold); }
    .h-dot.partial  { background: rgba(184,151,90,.35); }
    .h-dot.empty    { background: rgba(255,255,255,.08); }
    .h-dot.today-dot {
      box-shadow: 0 0 6px rgba(212,180,131,.8);
      border: 1px solid var(--gold-lt);
    }

    /* ── ORNAMENT ── */
    .ornament {
      display: flex; align-items: center; gap: 16px;
      width: 100%; max-width: 360px; margin-bottom: 32px;
    }
    .ornament-line { flex: 1; height: 1px; background: rgba(184,151,90,.2); }
    .ornament-diamond { width: 6px; height: 6px; background: var(--gold); transform: rotate(45deg); opacity: .5; }

    /* ── STATS FOOTER ── */
    .stats-footer {
      display: flex;
      gap: 0;
      border-top: 1px solid rgba(184,151,90,.15);
      padding-top: 32px;
      width: 100%;
      max-width: 400px;
      justify-content: center;
    }
    .sf-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 28px;
    }
    .sf-item + .sf-item { border-left: 1px solid rgba(184,151,90,.15); }
    .sf-num {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      color: var(--white);
    }
    .sf-label {
      font-size: 8px;
      letter-spacing: .16em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 4px;
      text-align: center;
    }

    /* ── PARTICLES ── */
    .particle {
      position: fixed;
      pointer-events: none;
      z-index: 999;
      font-size: 18px;
      animation: particleFly 1.4s ease-out forwards;
    }
    @keyframes particleFly {
      0%   { opacity: 1; transform: translate(0,0) scale(1); }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(0); }
    }

    /* ── ARABIC ── */
    [lang="ar"] body { font-family: 'Cairo', sans-serif; }
    [lang="ar"] .streak-num,
    [lang="ar"] .heart-name,
    [lang="ar"] .flame-message,
    [lang="ar"] .streak-best { font-family: 'Amiri', serif; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .heart-btn { padding: 20px 24px; min-width: 130px; }
      .sf-item { padding: 0 18px; }
      .stats-footer { max-width: 100%; }
    }
  </style>
</head>

<div class="page">

  <!-- STREAK -->
  <div class="streak-header">
    <div class="streak-num" id="streak-num">0</div>
    <div class="streak-label t" data-en="Day Streak" data-ar="أيام متتالية">Day Streak</div>
    <div class="streak-best" id="streak-best"></div>
  </div>

  <!-- FLAME -->
  <div class="flame-wrap dim" id="flame-wrap">
    <div class="flame-glow"></div>
    <svg class="flame-svg" viewBox="0 0 100 180" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <linearGradient id="bigFlameOuter" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%"   stop-color="#7A5A28"/>
          <stop offset="35%"  stop-color="#B8975A"/>
          <stop offset="75%"  stop-color="#D4B483"/>
          <stop offset="100%" stop-color="#EEE0C4"/>
        </linearGradient>
        <linearGradient id="bigFlameInner" x1="50%" y1="100%" x2="50%" y2="0%">
          <stop offset="0%"   stop-color="#D4B483" stop-opacity="0"/>
          <stop offset="55%"  stop-color="#EEE0C4" stop-opacity=".75"/>
          <stop offset="100%" stop-color="#FFF6DC"/>
        </linearGradient>
        <radialGradient id="bigFlameCore" cx="50%" cy="70%" r="55%">
          <stop offset="0%"   stop-color="#FFFBE8"/>
          <stop offset="60%"  stop-color="#F4E0A8" stop-opacity=".9"/>
          <stop offset="100%" stop-color="#D4B483" stop-opacity="0"/>
        </radialGradient>
      </defs>
      <!-- Outer flame silhouette -->
      <path d="M50 178
               C 18 178, 5 150, 8 110
               C 12 80, 30 70, 32 80
               C 34 92, 42 88, 40 78
               C 36 60, 30 40, 50 4
               C 60 28, 80 50, 85 100
               C 90 145, 78 178, 50 178 Z"
            fill="url(#bigFlameOuter)"/>
      <!-- Inner flame -->
      <path d="M50 165
               C 28 165, 22 138, 26 108
               C 30 90, 42 84, 42 92
               C 42 100, 50 96, 50 90
               C 50 78, 46 64, 52 46
               C 60 65, 76 88, 76 118
               C 76 145, 65 165, 50 165 Z"
            fill="url(#bigFlameInner)" opacity=".9"/>
      <!-- Bright animated core -->
      <ellipse class="flame-core" cx="50" cy="135" rx="18" ry="28" fill="url(#bigFlameCore)"/>
    </svg>
    <div class="wick"></div>
  </div>

  <!-- MESSAGE -->
  <div class="flame-message" id="flame-msg">Keep the flame alive today</div>

  <!-- HEARTS -->
  <div class="status-row">
    <button class="heart-btn" id="btn-ahmed" onclick="tap('ahmed', event)">
      <div class="heart-icon" id="heart-ahmed">♡</div>
      <div class="heart-name">Ahmed</div>
      <div class="heart-status-text t" id="status-ahmed" data-en="Tap to connect" data-ar="اضغط للتواصل">Tap to connect</div>
    </button>

    <div class="status-divider"></div>

    <button class="heart-btn" id="btn-alaa" onclick="tap('alaa', event)">
      <div class="heart-icon" id="heart-alaa">♡</div>
      <div class="heart-name">Alaa</div>
      <div class="heart-status-text t" id="status-alaa" data-en="Tap to connect" data-ar="اضغط للتواصل">Tap to connect</div>
    </button>
  </div>

  <!-- ORNAMENT -->
  <div class="ornament">
    <div class="ornament-line"></div>
    <div class="ornament-diamond"></div>
    <div class="ornament-line"></div>
  </div>

  <!-- HISTORY -->
  <div class="history-wrap">
    <div class="history-label t" data-en="Last 30 Days" data-ar="آخر ٣٠ يوماً">Last 30 Days</div>
    <div class="history-dots" id="history-dots"></div>
  </div>

  <!-- STATS -->
  <div class="stats-footer">
    <div class="sf-item">
      <div class="sf-num" id="stat-best">0</div>
      <div class="sf-label t" data-en="Best Streak" data-ar="أطول سلسلة">Best Streak</div>
    </div>
    <div class="sf-item">
      <div class="sf-num" id="stat-total">0</div>
      <div class="sf-label t" data-en="Days Together" data-ar="أيام معاً">Days Together</div>
    </div>
    <div class="sf-item">
      <div class="sf-num" id="stat-missed">0</div>
      <div class="sf-label t" data-en="Days Missed" data-ar="أيام فائتة">Days Missed</div>
    </div>
  </div>

</div>

<script>
  // ── JSONBIN ──
  const JB = {
    key:     '$2a$10$KbNF/mCJtyHlUvHzwELTKOdQ0Sybn.GKVOW/1S8XJqeZQrYSwULwq',
    flameId: '69efe637aaba88219745476c',
  };
  const LOCAL_KEY = 'flame_v1';
  let data = {};

  async function jbLoad() {
    try {
      const r = await fetch(`https://api.jsonbin.io/v3/b/${JB.flameId}/latest`, {
        headers: { 'X-Access-Key': JB.key }
      });
      if (r.ok) {
        const j = await r.json();
        if (j.record) {
          localStorage.setItem(LOCAL_KEY, JSON.stringify(j.record));
          return j.record;
        }
      }
    } catch {}
    try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {}; } catch { return {}; }
  }

  async function jbSave(d) {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(d));
    try {
      await fetch(`https://api.jsonbin.io/v3/b/${JB.flameId}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json', 'X-Access-Key': JB.key },
        body: JSON.stringify(d)
      });
    } catch(e) { console.warn('Sync failed (offline?):', e); }
  }

  // ── PASSWORD GATE ──
  localStorage.removeItem('flame_auth_v1');
  const AUTH_KEY = 'flame_auth_v1';
  const gate = document.getElementById('gate');

  function checkPass() {
    const input = document.getElementById('gate-input');
    const field = document.getElementById('gate-field');
    const err   = document.getElementById('gate-error');
    if (input.value === 'loving-husband') {
      sessionStorage.setItem(AUTH_KEY, 'yes');
      gate.classList.add('hide');
      init();
    } else {
      input.value = '';
      err.textContent = 'That\'s not the secret ♡';
      field.classList.remove('shake');
      void field.offsetWidth;
      field.classList.add('shake');
      setTimeout(() => { err.textContent = ''; }, 2400);
    }
  }

  document.getElementById('gate-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') checkPass();
  });

  if (sessionStorage.getItem(AUTH_KEY) === 'yes') {
    gate.classList.add('hide');
    // Defer until after MSGS/render exist (const order below).
    queueMicrotask(() => { void init(); });
  }

  // ── UTILS ──
  // A "logical day" runs from 00:20 Cairo to 00:20 next day Cairo.
  // We compute Cairo wall time, subtract 20 minutes, then take YYYY-MM-DD.
  const DAY_OFFSET_MIN = 20;            // new day starts at 00:20 Cairo
  const TZ = 'Africa/Cairo';

  function cairoNow() {
    // Build a Date whose UTC fields equal Cairo wall-clock fields
    const parts = new Intl.DateTimeFormat('en-CA', {
      timeZone: TZ,
      year: 'numeric', month: '2-digit', day: '2-digit',
      hour: '2-digit', minute: '2-digit', second: '2-digit',
      hour12: false
    }).formatToParts(new Date());
    const o = {};
    for (const p of parts) o[p.type] = p.value;
    // 'en-CA' gives 24h with possible "24" for midnight in some envs — normalise
    if (o.hour === '24') o.hour = '00';
    return new Date(`${o.year}-${o.month}-${o.day}T${o.hour}:${o.minute}:${o.second}Z`);
  }

  function todayStr() {
    const d = cairoNow();
    d.setUTCMinutes(d.getUTCMinutes() - DAY_OFFSET_MIN);
    return d.toISOString().slice(0, 10);
  }

  function addDays(d, n) {
    const r = new Date(d);
    r.setUTCDate(r.getUTCDate() + n);
    return r;
  }

  function ds(d) { return d instanceof Date ? d.toISOString().slice(0,10) : d; }

  /** Shift a YYYY-MM-DD string by n days (UTC noon anchor — matches baseline + todayStr). */
  function addDaysToIso(isoStr, n) {
    return addDays(new Date(isoStr + 'T12:00:00Z'), n).toISOString().slice(0, 10);
  }

  // ── DATA ──
  function normalizeFlameRecord(raw) {
    const d = raw && typeof raw === 'object' ? raw : {};
    if (!d.ahmed) d.ahmed = {};
    if (!d.alaa) d.alaa = {};
    if (d.best == null || d.best === '') d.best = 0;
    return d;
  }

  function readFlameFromCache() {
    try {
      return normalizeFlameRecord(JSON.parse(localStorage.getItem(LOCAL_KEY) || '{}'));
    } catch {
      return normalizeFlameRecord({});
    }
  }

  async function init() {
    data = readFlameFromCache();
    render();
    data = normalizeFlameRecord(await jbLoad());
    render();
  }

  // ── STREAK LOGIC ──
  const FLAME_BASELINE_START = '2025-12-09';

  /** Virtual “both connected” for every day from engagement through today (no JSONBin writes). */
  function baselineCompleteSet() {
    const s = new Set();
    let d = new Date(FLAME_BASELINE_START + 'T12:00:00Z');
    const end = new Date(todayStr() + 'T12:00:00Z');
    while (d <= end) {
      s.add(ds(d));
      d = addDays(d, 1);
    }
    return s;
  }

  function completeDays() {
    const ahmedDays = new Set(Object.keys(data.ahmed));
    const alaaDays  = new Set(Object.keys(data.alaa));
    const actual = new Set([...ahmedDays].filter(d => alaaDays.has(d)));
    const merged = new Set([...actual, ...baselineCompleteSet()]);
    return [...merged].sort();
  }

  function calcStreak(days) {
    if (!days.length) return 0;
    const set = new Set(days);
    let streak = 0;
    let cur = todayStr();
    while (set.has(cur)) {
      streak++;
      cur = addDaysToIso(cur, -1);
    }
    return streak;
  }

  function calcBest(days) {
    if (!days.length) return 0;
    let best = 0, cur = 0, prev = null;
    for (const s of days) {
      const d = new Date(s + 'T12:00:00Z');
      cur = prev && (d - prev) === 86400000 ? cur + 1 : 1;
      best = Math.max(best, cur);
      prev = d;
    }
    return best;
  }

  // ── MESSAGES ──
  const MSGS = {
    en: {
      none:    'Keep the flame alive today',
      ahmed:   'Alaa — your tap completes us today ♡',
      alaa:    'Ahmed — your tap completes us today ♡',
      both:    'The flame burns bright — {n} days strong ✦',
      already: 'Both connected today — come back tomorrow ♡',
    },
    ar: {
      none:    'أبقوا الشعلة حية اليوم',
      ahmed:   'آلاء — تواصلكِ اليوم يُكمل الشعلة ♡',
      alaa:    'أحمد — تواصلك اليوم يُكمل الشعلة ♡',
      both:    'الشعلة تتقد بقوة — {n} يوماً متتالياً ✦',
      already: 'كلاكما تواصل اليوم — عودوا غداً ♡',
    }
  };

  // ── TAP ──
  async function tap(who, event) {
    const today = todayStr();
    if (data[who][today]) return;

    // Ripple (instant feedback)
    const btn  = event.currentTarget;
    const rect = btn.getBoundingClientRect();
    const rip  = document.createElement('div');
    rip.className = 'ripple';
    const size = Math.max(rect.width, rect.height);
    rip.style.cssText = `width:${size}px;height:${size}px;left:${(rect.width-size)/2}px;top:${(rect.height-size)/2}px`;
    btn.appendChild(rip);
    setTimeout(() => rip.remove(), 700);

    data[who][today] = true;

    if (data.ahmed[today] && data.alaa[today]) {
      data.best = Math.max(calcBest(completeDays()), data.best || 0);
      burstParticles();
    }

    render();           // instant UI
    await jbSave(data); // sync to cloud
  }

  // ── PARTICLES ──
  function burstParticles() {
    const chars = ['✦', '♡', '✧', '⋆', '♥'];
    const cx = window.innerWidth / 2;
    const cy = window.innerHeight / 2;
    for (let i = 0; i < 22; i++) {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'particle';
        el.textContent = chars[Math.floor(Math.random() * chars.length)];
        el.style.left = cx + 'px';
        el.style.top  = cy + 'px';
        el.style.color = Math.random() > .5 ? '#D4B483' : '#B8975A';
        const angle = Math.random() * Math.PI * 2;
        const dist  = 80 + Math.random() * 180;
        el.style.setProperty('--px', Math.cos(angle) * dist + 'px');
        el.style.setProperty('--py', Math.sin(angle) * dist + 'px');
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1500);
      }, i * 40);
    }
  }

  // ── RENDER ──
  function render() {
    const today  = todayStr();
    const ahmed  = !!data.ahmed[today];
    const alaa   = !!data.alaa[today];
    const both   = ahmed && alaa;
    const lang   = document.documentElement.lang || 'en';
    const msgs   = MSGS[lang] || MSGS.en;

    // Flame state
    const flame = document.getElementById('flame-wrap');
    flame.className = 'flame-wrap ' + (both ? 'full' : ahmed || alaa ? 'half' : 'dim');

    // Hearts
    const btnA = document.getElementById('btn-ahmed');
    const btnL = document.getElementById('btn-alaa');
    const hA   = document.getElementById('heart-ahmed');
    const hL   = document.getElementById('heart-alaa');
    const sA   = document.getElementById('status-ahmed');
    const sL   = document.getElementById('status-alaa');

    btnA.classList.toggle('tapped', ahmed);
    btnL.classList.toggle('tapped', alaa);
    hA.textContent = ahmed ? '♥' : '♡';
    hL.textContent = alaa  ? '♥' : '♡';

    const connected   = lang === 'ar' ? 'تواصل اليوم ✓' : 'Connected today ✓';
    const tapToday    = lang === 'ar' ? 'اضغط للتواصل' : 'Tap to connect';
    const waitingAhmed = lang === 'ar' ? 'أحمد — دورك في التواصل ♡' : 'Ahmed — your turn to tap ♡';
    const waitingAlaa  = lang === 'ar' ? 'آلاء — دوركِ في التواصل ♡' : 'Alaa — your turn to tap ♡';

    sA.textContent = ahmed ? connected : (alaa ? waitingAhmed : tapToday);
    sL.textContent = alaa  ? connected : (ahmed ? waitingAlaa  : tapToday);

    // Message
    const msg = document.getElementById('flame-msg');
    const days = completeDays();
    const streak = calcStreak(days);

    if (both) {
      msg.textContent = msgs.both.replace('{n}', streak);
      msg.classList.add('lit');
    } else if (ahmed && !alaa) {
      msg.textContent = msgs.ahmed;
      msg.classList.remove('lit');
    } else if (alaa && !ahmed) {
      msg.textContent = msgs.alaa;
      msg.classList.remove('lit');
    } else {
      msg.textContent = msgs.none;
      msg.classList.remove('lit');
    }

    // Streak number
    const numEl = document.getElementById('streak-num');
    const prevNum = parseInt(numEl.textContent) || 0;
    numEl.textContent = streak;
    if (streak > prevNum) { numEl.classList.remove('pop'); void numEl.offsetWidth; numEl.classList.add('pop'); }

    // Best streak
    const best = Math.max(calcBest(days), data.best || 0);
    document.getElementById('streak-best').textContent =
      best > 0 ? (lang === 'ar' ? `أطول سلسلة: ${best} يوم` : `Best: ${best} day${best===1?'':'s'}`) : '';

    // Stats
    document.getElementById('stat-best').textContent   = best;
    document.getElementById('stat-total').textContent  = days.length;

    // Missed days: from first complete day to today, how many days with no entry
    const firstDay = days[0] || today;
    const totalSince = Math.round(
      (new Date(today + 'T12:00:00Z') - new Date(firstDay + 'T12:00:00Z')) / 86400000
    );
    document.getElementById('stat-missed').textContent = Math.max(0, totalSince - days.length);

    // History dots
    renderDots(days);
  }

  function renderDots(completeDays) {
    const container = document.getElementById('history-dots');
    container.innerHTML = '';
    const today = todayStr();
    const set   = new Set(completeDays);

    for (let i = 29; i >= 0; i--) {
      const str = addDaysToIso(today, -i);
      const d   = new Date(str + 'T12:00:00Z');
      const dot = document.createElement('div');
      dot.className = 'h-dot';
      dot.title = d.toLocaleDateString('en', { month: 'short', day: 'numeric' });

      const ahmedTapped = !!data.ahmed[str];
      const alaaTapped  = !!data.alaa[str];

      if      (set.has(str))                dot.classList.add('complete');
      else if (ahmedTapped || alaaTapped)   dot.classList.add('partial');
      else                                   dot.classList.add('empty');

      if (str === today) dot.classList.add('today-dot');
      container.appendChild(dot);
    }
  }

  // ── LANG TOGGLE ──
  let lang = 'en';
  function toggleLang() {
    lang = lang === 'en' ? 'ar' : 'en';
    const html = document.documentElement;
    html.lang = lang;
    html.dir  = lang === 'ar' ? 'rtl' : 'ltr';
    document.querySelector('.topnav-lang').textContent = lang === 'ar' ? 'English' : 'عربي';

    document.querySelectorAll('.t[data-en]').forEach(el => {
      el.textContent = el.dataset[lang];
    });

    render();
  }

  // ── DAY ROLLOVER WATCHER ──
  // Polls every 30s. When the logical day (Cairo, 00:20 boundary) flips,
  // re-fetches from the cloud and re-renders so the open tab transitions
  // automatically without a reload. Also re-syncs whenever the tab regains focus.
  let _currentDayKey = todayStr();

  async function refreshIfDayChanged() {
    const k = todayStr();
    if (k !== _currentDayKey) {
      _currentDayKey = k;
      if (data && data.ahmed) {
        data = await jbLoad();
        if (!data.ahmed) data.ahmed = {};
        if (!data.alaa)  data.alaa  = {};
        if (!data.best)  data.best  = 0;
        render();
      }
    }
  }

  setInterval(refreshIfDayChanged, 30000);

  document.addEventListener('visibilitychange', async () => {
    if (document.hidden) return;
    if (!data || !data.ahmed) return;
    _currentDayKey = todayStr();
    data = await jbLoad();
    if (!data.ahmed) data.ahmed = {};
    if (!data.alaa)  data.alaa  = {};
    if (!data.best)  data.best  = 0;
    render();
  });

</script>
</body>
